<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test - G-WAC Course</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Debug Test Page</h1>
    
    <div class="case-study">
        <h4>Test Case Study</h4>
        <p>This is a test case study to see if the styling works.</p>
        <div class="study-details">
            <div class="study-finding">
                <h5>Test Finding</h5>
                <ul>
                    <li>Test item 1</li>
                    <li>Test item 2</li>
                </ul>
            </div>
        </div>
    </div>
    
    <div class="strategy">
        <h5>Test Strategy</h5>
        <p>This is a test strategy.</p>
        <div class="strategy-metrics">
            <span class="metric">Test Metric: 100</span>
        </div>
    </div>
    
    <div class="theme-toggle">
        <span class="icon">🌙</span>
    </div>
    
    <div class="course-progress">
        <div class="progress-info">
            <span class="progress-label">Course Progress</span>
            <span class="progress-percentage">50%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" style="width: 50%"></div>
        </div>
        <div class="progress-stats">
            <span class="completed-modules">3/6</span> modules completed
        </div>
    </div>
    
    <script src="js/script.js"></script>
    <script>
        console.log('Test page loaded');
    </script>
</body>
</html>
